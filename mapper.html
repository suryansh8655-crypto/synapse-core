<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SYNAPSE // Auto-Mapper</title>
</head>
<body style="background:#08080a; color:#fff; text-align:center; padding:50px;">
    <h2>Automated ID Mapper</h2>
    <input type="file" id="f" accept=".json">
    <p id="status">Upload your playlist.json to start mapping...</p>

    <div style="margin-top: 20px;">
        <a href="index.html" style="color: #444; text-decoration: none; font-family: monospace; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;">// Return to Core Node</a>
    </div>

    <script>
    document.getElementById('f').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        let songs;
        try {
            songs = JSON.parse(await file.text());
        } catch (err) {
            document.getElementById('status').innerText =
                "Invalid playlist.json";
            return;
        }

        const status = document.getElementById('status');

        for (let i = 0; i < songs.length; i++) {
            const s = songs[i];

            status.innerText =
                `Resolving [${i + 1}/${songs.length}]: ${s.title}`;

            try {
                const query = encodeURIComponent(
                    `${s.title} ${s.artist}`
                );

                const res = await fetch(
                    `https://inv.nadeko.net/api/v1/search?q=${query}&type=video`
                );

                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }

                const results = await res.json();

                if (
                    Array.isArray(results) &&
                    results.length > 0 &&
                    results[0].videoId
                ) {
                    s.youtubeId = results[0].videoId;
                } else {
                    s.youtubeId = "";
                    console.warn(`No result found for: ${s.title}`);
                }

            } catch (err) {
                console.error(
                    `Failed to resolve "${s.title}"`,
                    err
                );
                s.youtubeId = "";
            }
        }

        const downloadLink = document.createElement('a');
        downloadLink.href =
            "data:text/json;charset=utf-8," +
            encodeURIComponent(
                JSON.stringify(songs, null, 2)
            );

        downloadLink.download = "playlist.json";
        downloadLink.click();

        status.innerText =
            "Complete! New playlist.json downloaded with YouTube IDs.";
    });
    </script>
</body>
</html>
